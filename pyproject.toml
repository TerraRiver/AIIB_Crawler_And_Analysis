[project]
name = "aiib-crawler"
version = "0.1.0"
description = "Playwright & HTTP-based crawler for AIIB projects, procurement, governance, and accountability data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "markdownify>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0.0",
    "pillow>=13.0.0",
    "playwright>=1.50.0",
    "pypdf>=5.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "trafilatura>=2.0.0",
]

[project.scripts]
aiib-crawler = "aiib_crawler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiib_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
